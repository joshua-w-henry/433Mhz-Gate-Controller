[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.11.11
  jgromes/RadioLib@7.1.2

; OTA uses the same firmware. Provide the password via the local
; PLATFORMIO_UPLOAD_FLAGS environment variable (never commit it).
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.86.58
